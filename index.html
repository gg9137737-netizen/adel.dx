<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adel.dz - Gaming Creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: white;
            padding: 45px 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            color: white;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 30px;
            color: #2d3748;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .subtitle {
            color: #718096;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .link-btn:active {
            transform: translateY(0);
        }

        .icon {
            font-size: 22px;
        }

        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">A</div>
        <h1>adel.dz</h1>
        <p class="subtitle">🎮 صانع محتوى قيمنق</p>
        
        <div class="links">
            <a href="https://www.instagram.com/adel.dz80?igsh=eHJqcTU2czdlbmto" target="_blank" class="link-btn">
                <span class="icon">📷</span>
                <span>Instagram</span>
            </a>
            
            <!-- يمكنك إضافة المزيد من الروابط -->
            <!--
            <a href="رابط_يوتيوب" target="_blank" class="link-btn">
                <span class="icon">🎬</span>
                <span>YouTube</span>
            </a>
            
            <a href="رابط_تيك_توك" target="_blank" class="link-btn">
                <span class="icon">🎵</span>
                <span>TikTok</span>
            </a>
            
            <a href="رابط_تويتر" target="_blank" class="link-btn">
                <span class="icon">🐦</span>
                <span>Twitter</span>
            </a>
            -->
        </div>
        
        <div class="footer">
            تابعني لأحدث محتوى القيمنق! ⚡
        </div>
    </div>
</body>
</html>
